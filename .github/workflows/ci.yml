name: CI

# Keep the required CI check local while the release-pinned workflow owns the
# shared jobs. The repository-specific annotation breadth check stays beside it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The weekly full mutation pass, which catches decay no pull request touches (a dependency or
  # tooling change). Monday 07:17 UTC (01:17 Central), off the hour so scheduled runs across the
  # organization do not all start together. GitHub runs a schedule from the default branch's copy
  # of this file. On a `schedule` or `workflow_dispatch` run the chain's `mutate` job mutates
  # everything `composer mutate` covers.
  schedule:
    - cron: '17 7 * * 1'

# Replace stale pull-request runs, but never cancel a different main commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.1.0
    with:
      # On a pull request the mutate job mutates the changed PHP files under this path. On a push it
      # ignores this input and runs `composer mutate`, whose `--path=src` covers the same tree.
      mutate-paths: src

  mutate-ignore-breadth:
    name: Mutation annotations (breadth)
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: php .claude/skills/pest-testing/scripts/check-mutate-ignore-breadth.php

  ci:
    name: CI
    needs: [checks, mutate-ignore-breadth]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list proves nothing, even though a loop would accept it.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
