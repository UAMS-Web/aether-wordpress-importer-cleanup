name: CI

# Keep the required CI check local while the release-pinned workflow owns the
# shared jobs. The repository-specific annotation breadth check stays beside it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Replace stale pull-request runs, but never cancel a different main commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.1.0
    with:
      mutate-paths: src

  mutate-ignore-breadth:
    name: Mutation annotations (breadth)
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: php .claude/skills/pest-testing/scripts/check-mutate-ignore-breadth.php

  ci:
    name: CI
    needs: [checks, mutate-ignore-breadth]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list proves nothing, even though a loop would accept it.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
